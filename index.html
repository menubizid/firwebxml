/* =========================================================================
   FIRMAN WEB · NUSANTARA CONNECT — Design System v1.4
   Struktur: 1) Tokens  2) Reset & Base  3) Tipografi  4) Komponen
             5) Header/Footer 5 varian brand  6) Sections  7) Motion
             8) Responsive  9) Utilitas & Print
   ========================================================================= */

/* ---------- 1. TOKENS -------------------------------------------------- */
:root{
  --bg:#FBF8F3;
  --bg-tint:#F4EEE3;
  --surface:#FFFFFF;
  --surface-2:#FBF7F0;
  --ink:#16211E;
  --ink-soft:#3C4A46;
  --muted:#63716C;
  --brand:#0E7C66;
  --brand-deep:#0A5546;
  --brand-soft:#E4F1EC;
  --accent:#C79A3B;
  --accent-soft:#FBF1DC;
  --line:#E7DFD2;
  --line-strong:#D6CBB8;
  --ok:#16794C;
  --warn:#B5731B;
  --danger:#B4341F;
  --radius:20px;
  --radius-lg:28px;
  --radius-s:14px;
  --radius-xs:10px;
  --shadow-1:0 1px 2px rgba(22,33,30,.05), 0 14px 30px -18px rgba(22,33,30,.28);
  --shadow-2:0 2px 6px rgba(22,33,30,.05), 0 32px 60px -28px rgba(22,33,30,.35);
  --shadow-brand:0 18px 40px -20px color-mix(in srgb, var(--brand) 55%, transparent);
  --ff-display:"Playfair Display", "Iowan Old Style", Georgia, serif;
  --ff-body:"Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --ff-alt:"Plus Jakarta Sans", system-ui, sans-serif;
  --maxw:1200px;
  --pad:clamp(18px, 4vw, 40px);
  --sec:clamp(56px, 8vw, 118px);
  --head-h:76px;
  --dur:.5s;
  --ease:cubic-bezier(.22,.75,.24,1);
  --pattern-kawung:.;
  --nav-gap:clamp(6px, 1.4vw, 20px);
  --text-scale:1;
}

/* --- Brand: Paes Nusa (Wedding Organizer) — Rose Plum --- */
html[data-brand="wo"]{
  --bg:#FDF7F5; --bg-tint:#F7EBE7; --surface:#FFFFFF; --surface-2:#FEF8F6;
  --ink:#2A1B21; --ink-soft:#4B3540; --muted:#7A616C;
  --brand:#A63D6B; --brand-deep:#6F2145; --brand-soft:#F8E6EE;
  --accent:#C9954E; --accent-soft:#F8EEDD;
  --line:#EBDBD7; --line-strong:#DCC3BD;
  --radius:16px; --radius-lg:22px; --radius-s:12px;
  --ff-display:"Cormorant Garamond", "Didot", Georgia, serif;
  --ff-body:"Jost", system-ui, sans-serif;
  --head-h:84px;
}
/* --- Brand: Asosiasi Perias Nusantara — Nusantara Indigo --- */
html[data-brand="asosiasi"]{
  --bg:#F5F8FB; --bg-tint:#E8EFF6; --surface:#FFFFFF; --surface-2:#F7FAFD;
  --ink:#10202E; --ink-soft:#33475A; --muted:#5D7286;
  --brand:#16457E; --brand-deep:#0C2C53; --brand-soft:#E4EDF8;
  --accent:#C08B2E; --accent-soft:#FAF0DA;
  --line:#DCE6F0; --line-strong:#C3D3E3;
  --radius:14px; --radius-lg:18px; --radius-s:10px;
  --ff-display:"Archivo", "Helvetica Neue", Arial, sans-serif;
  --ff-body:"Archivo", system-ui, sans-serif;
  --head-h:92px;
}
/* --- Brand: Mbak Ayu (Personal Branding) — Sogan & Lilac --- */
html[data-brand="ayu"]{
  --bg:#FCF9F5; --bg-tint:#F2E9E0; --surface:#FFFFFF; --surface-2:#FBF5EF;
  --ink:#26202B; --ink-soft:#463C4C; --muted:#6E6376;
  --brand:#7C4E6B; --brand-deep:#4E2A42; --brand-soft:#F3E7EF;
  --accent:#B5843C; --accent-soft:#F7EEDC;
  --line:#EADFD4; --line-strong:#DAC9B9;
  --radius:26px; --radius-lg:34px; --radius-s:16px;
  --ff-display:"Marcellus", "Cormorant Garamond", Georgia, serif;
  --ff-body:"Plus Jakarta Sans", system-ui, sans-serif;
  --head-h:78px;
}
/* --- Brand: Pak Urip Sedyowidodo — Hijau Rakyat & Oker --- */
html[data-brand="urip"]{
  --bg:#F7F6F1; --bg-tint:#EDEBD9; --surface:#FFFFFF; --surface-2:#FAF9F4;
  --ink:#16251C; --ink-soft:#31463A; --muted:#556B5D;
  --brand:#1B5E3A; --brand-deep:#0E3A22; --brand-soft:#E3F0E7;
  --accent:#D9942A; --accent-soft:#FBEFD8;
  --line:#DFE1D4; --line-strong:#C8CBBA;
  --radius:10px; --radius-lg:14px; --radius-s:8px;
  --ff-display:"Archivo", Impact, sans-serif;
  --ff-body:"Manrope", system-ui, sans-serif;
  --head-h:74px;
}
/* --- Hub (halaman jaringan / panduan) — Sogan Hangat --- */
html[data-brand="hub"]{
  --bg:#FAF7F2; --bg-tint:#F0E9DD; --surface:#FFFFFF; --surface-2:#FBF8F3;
  --ink:#1B2220; --ink-soft:#3A443F; --muted:#65706A;
  --brand:#155E52; --brand-deep:#0A3B34; --brand-soft:#E3EFEA;
  --accent:#BE8F32; --accent-soft:#FAF0DB;
  --line:#E6DFD3; --line-strong:#D3C9B7;
  --ff-display:"Playfair Display", Georgia, serif;
  --ff-body:"Plus Jakarta Sans", system-ui, sans-serif;
  --head-h:80px;
}

/* ---------- 2. RESET & BASE ------------------------------------------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--ff-body);
  font-size:calc(17px * var(--text-scale));
  line-height:1.68;letter-spacing:.005em;
  overflow-x:clip;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}
body.is-locked{overflow:hidden}
img,svg,video{max-width:100%;display:block}
img{height:auto;background:var(--bg-tint)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
h1,h2,h3,h4,h5{margin:0;font-family:var(--ff-display);font-weight:700;line-height:1.12;letter-spacing:-.015em}
h1{font-size:calc(clamp(2.35rem, 1.2rem + 4.4vw, 4.3rem) * var(--text-scale))}
h2{font-size:calc(clamp(1.85rem, 1.05rem + 2.5vw, 3rem) * var(--text-scale))}
h3{font-size:calc(clamp(1.24rem, .95rem + 1vw, 1.6rem) * var(--text-scale));line-height:1.24}
h4{font-size:calc(1.08rem * var(--text-scale));line-height:1.35}
p{margin:0 0 1em}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
::selection{background:var(--brand);color:#fff}
.skip{position:absolute;left:12px;top:-70px;z-index:200;background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;transition:top .2s}
.skip:focus{top:12px}

/* ---------- 3. LAYOUT -------------------------------------------------- */
.wrap{width:100%;max-width:var(--maxw);margin-inline:auto;padding-inline:var(--pad)}
.wrap-wide{max-width:1440px}
section.sec{padding-block:var(--sec);position:relative}
.sec-tint{background:linear-gradient(180deg,var(--surface-2),var(--bg))}
.sec-brand{background:linear-gradient(160deg,var(--brand) 0%,var(--brand-deep) 100%);color:#fff}
.sec-brand h2,.sec-brand h3{color:#fff}
.soft-grid{background-image:radial-gradient(circle at 1px 1px, color-mix(in srgb,var(--ink) 8%, transparent) 1px, transparent 0);background-size:26px 26px}
.grid{display:grid;gap:clamp(14px,2.2vw,26px)}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.row-end{justify-content:flex-end}
.between{justify-content:space-between}
.center{text-align:center}
.mw60{max-width:62ch}
.mw48{max-width:48ch}
.mt0{margin-top:0}.mb0{margin-bottom:0}

/* ---------- 4. TIPOGRAFI & EYEBROW ------------------------------------- */
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  font-family:var(--ff-alt);font-size:calc(0.9rem * var(--text-scale));font-weight:700;
  letter-spacing:.14em;text-transform:uppercase;color:var(--brand);
  background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 18%, transparent);
  padding:8px 15px;border-radius:999px;margin:0 0 18px;
}
.eyebrow.on-dark{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.28)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
.lead{font-size:calc(clamp(1.02rem,.98rem + .35vw,1.24rem) * var(--text-scale));color:var(--ink-soft);max-width:64ch}
.muted{color:var(--muted)}
.display{font-family:var(--ff-display)}
.serif-i{font-style:italic;font-family:"Cormorant Garamond",Georgia,serif}
.grad-text{background:linear-gradient(100deg,var(--brand),var(--accent) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head{max-width:74ch;margin-bottom:clamp(26px,3.4vw,48px)}
.sec-head h2{margin-bottom:12px}
.sec-head.between{display:flex;justify-content:space-between;align-items:flex-end;gap:26px;max-width:none;flex-wrap:wrap}
.num{font-family:var(--ff-display);font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}

/* ---------- 5. KOMPONEN ------------------------------------------------ */
.btn{
  --bg-b:var(--brand);--fg-b:#fff;
  position:relative;overflow:hidden;isolation:isolate;
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  padding:15px 26px;border-radius:999px;border:1px solid transparent;
  background:var(--bg-b);color:var(--fg-b);
  font-family:var(--ff-body);font-size:calc(0.98rem * var(--text-scale));font-weight:650;letter-spacing:.01em;
  cursor:pointer;text-align:center;min-height:52px;
  transition:transform .28s var(--ease), box-shadow .28s var(--ease), background .28s var(--ease), color .2s;
  box-shadow:var(--shadow-brand);
}
.btn:hover{transform:translateY(-3px)}
.btn:active{transform:translateY(0) scale(.985)}
.btn svg{width:18px;height:18px;flex:none}
.btn-ghost{--bg-b:transparent;--fg-b:var(--ink);border-color:var(--line-strong);box-shadow:none;background:color-mix(in srgb,var(--surface) 70%, transparent)}
.btn-ghost:hover{background:var(--surface);border-color:var(--brand);color:var(--brand);box-shadow:var(--shadow-1)}
.btn-accent{--bg-b:var(--accent);--fg-b:#2A2213;box-shadow:0 18px 34px -20px color-mix(in srgb,var(--accent) 70%, transparent)}
.btn-light{--bg-b:#fff;--fg-b:var(--brand-deep);box-shadow:0 18px 40px -22px rgba(0,0,0,.5)}
.btn-wa{--bg-b:#128C4B;--fg-b:#fff}
.btn-sm{padding:10px 18px;min-height:44px;font-size:calc(0.9rem * var(--text-scale))}
.btn-block{width:100%}
.btn-ripple{position:absolute;inset:0;pointer-events:none}
.btn-ripple span{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);background:rgba(255,255,255,.42);animation:ripple .62s var(--ease) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(22);opacity:0}}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:clamp(20px,2.4vw,30px);position:relative;overflow:hidden;
  box-shadow:var(--shadow-1);
  transition:transform .38s var(--ease), box-shadow .38s var(--ease), border-color .3s;
}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-2);border-color:var(--line-strong)}
.card-link{display:flex;flex-direction:column;height:100%;gap:12px}
.card-flat{box-shadow:none}
.card-flat:hover{transform:translateY(-3px)}
.card-ink{background:var(--ink);color:#F6F3EE;border-color:transparent}
.card-ink:hover{border-color:transparent}
.card-brand{background:linear-gradient(150deg,var(--brand),var(--brand-deep));color:#fff;border-color:transparent}
.card-brand .muted{color:rgba(255,255,255,.78)}
.card-glass{
  background:color-mix(in srgb,var(--surface) 62%, transparent);
  backdrop-filter:blur(16px) saturate(1.35);-webkit-backdrop-filter:blur(16px) saturate(1.35);
  border-color:color-mix(in srgb,var(--surface) 85%, transparent);
}
.card-media{padding:0;display:flex;flex-direction:column;overflow:hidden}
.card-media .media{aspect-ratio:16/10;overflow:hidden;position:relative}
.card-media .media img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease), filter .6s}
.card-media:hover .media img{transform:scale(1.06)}
.card-body{padding:clamp(18px,2vw,26px);display:flex;flex-direction:column;gap:10px;flex:1}
.card-foot{margin-top:auto;padding-top:6px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}

.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 13px;border-radius:999px;background:var(--brand-soft);color:var(--brand-deep);font-size:calc(0.9rem * var(--text-scale));font-weight:600;border:1px solid color-mix(in srgb,var(--brand) 15%, transparent)}
.chip-line{background:transparent;color:var(--ink-soft);border-color:var(--line-strong)}
.chip-accent{background:var(--accent-soft);color:#7A5713;border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.chip-ok{background:#E7F5EC;color:#146B43;border-color:#BCE3CB}
.chip-warn{background:#FCF1DE;color:#8A5A0F;border-color:#F0D6AC}

.pill{display:inline-flex;gap:6px;flex-wrap:wrap}
.divider{height:1px;background:var(--line);border:0;margin:26px 0}
.kicker-row{display:flex;align-items:center;gap:14px;color:var(--muted);font-weight:600;font-size:calc(0.9rem * var(--text-scale));text-transform:uppercase;letter-spacing:.12em}
.kicker-row::after{content:"";flex:1;height:1px;background:var(--line)}

.icon{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.icon-badge{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-deep);flex:none;transition:transform .4s var(--ease), background .4s}
.card:hover .icon-badge{transform:rotate(-8deg) scale(1.06);background:var(--brand);color:#fff}
.icon-badge svg{width:24px;height:24px}

.metric{display:flex;flex-direction:column;gap:2px}
.metric b{font-family:var(--ff-display);font-size:clamp(1.9rem,1.2rem + 2.4vw,2.9rem);line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}
.metric span{color:var(--muted);font-size:calc(0.92rem * var(--text-scale));font-weight:500}

.list-check{display:grid;gap:12px}
.list-check li{display:flex;gap:12px;align-items:flex-start;color:var(--ink-soft)}
.list-check svg{width:22px;height:22px;flex:none;color:var(--brand);margin-top:2px}
.sec-brand .list-check svg{color:var(--accent)}

/* Media & figure */
.media{position:relative;overflow:hidden;border-radius:var(--radius);background:var(--bg-tint)}
.media img{width:100%;height:100%;object-fit:cover}
.media-frame{border:1px solid var(--line);box-shadow:var(--shadow-2)}
figcaption{font-size:calc(0.9rem * var(--text-scale));color:var(--muted);margin-top:10px}
.r-16-10{aspect-ratio:16/10}.r-4-3{aspect-ratio:4/3}.r-1-1{aspect-ratio:1/1}
.r-3-4{aspect-ratio:3/4}.r-21-9{aspect-ratio:21/9}.r-4-5{aspect-ratio:4/5}

/* Batik / kawung ambient background */
.batik{position:absolute;inset:0;pointer-events:none;opacity:.06;
  background-image:var(--batik-src,none);background-size:120px 120px;mix-blend-mode:multiply}
.glow{position:absolute;pointer-events:none;border-radius:50%;filter:blur(70px);opacity:.55;z-index:0}
.glow-1{width:44vw;height:44vw;background:radial-gradient(circle,color-mix(in srgb,var(--brand) 45%,transparent),transparent 70%);top:-14vw;right:-10vw;animation:float 17s ease-in-out infinite alternate}
.glow-2{width:38vw;height:38vw;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 42%,transparent),transparent 70%);bottom:-16vw;left:-8vw;animation:float 21s ease-in-out infinite alternate-reverse}
@keyframes float{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(3vw,-4vh,0) scale(1.12)}}

/* ---------- 6. HEADER -------------------------------------------------- */
.shell{position:relative;z-index:2}
.topbar{background:var(--ink);color:#F3EFE8;font-size:calc(0.9rem * var(--text-scale));padding:9px 0}
.topbar a{opacity:.9}.topbar a:hover{opacity:1;text-decoration:underline}
.topbar .wrap{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.topbar .dot{width:6px;height:6px;border-radius:50%;background:#7FD8A6;display:inline-block;margin-right:7px;animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.head{
  position:sticky;top:0;z-index:60;
  background:color-mix(in srgb,var(--bg) 82%, transparent);
  backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);
  border-bottom:1px solid transparent;transition:box-shadow .3s, border-color .3s, background .3s, padding .3s;
}
.head.stuck{border-color:var(--line);box-shadow:0 10px 30px -22px rgba(20,20,20,.4);background:color-mix(in srgb,var(--surface) 92%, transparent)}
.head-in{display:flex;align-items:center;gap:clamp(10px,2vw,26px);min-height:var(--head-h);position:relative}
.brandmark{display:flex;align-items:center;gap:12px;flex:none;margin-right:auto}
.brandmark .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--brand),var(--brand-deep));color:#fff;flex:none;box-shadow:var(--shadow-brand);transition:transform .5s var(--ease)}
.brandmark:hover .logo{transform:rotate(-10deg) scale(1.05)}
.brandmark .logo svg{width:26px;height:26px}
.brandmark b{display:block;font-family:var(--ff-display);font-size:calc(1.06rem * var(--text-scale));line-height:1.1;font-weight:700;letter-spacing:-.01em}
.brandmark small{display:block;font-size:calc(0.9rem * var(--text-scale));color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.nav{display:flex;align-items:center;gap:var(--nav-gap);flex-wrap:nowrap}
.nav a{
  position:relative;padding:10px 13px;border-radius:12px;font-weight:600;
  font-size:calc(0.95rem * var(--text-scale));color:var(--ink-soft);white-space:nowrap;
  transition:color .25s, background .25s;
}
.nav a::after{content:"";position:absolute;left:13px;right:13px;bottom:5px;height:2px;background:var(--brand);transform:scaleX(0);transform-origin:left;transition:transform .34s var(--ease);border-radius:2px}
.nav a:hover{color:var(--brand)}
.nav a:hover::after,.nav a[aria-current="page"]::after{transform:scaleX(1)}
.nav a[aria-current="page"]{color:var(--brand)}
.head-cta{display:flex;align-items:center;gap:10px;flex:none}

/* varian header: WO (serif tengah) */
html[data-brand="wo"] .head-in{flex-direction:column;gap:2px;padding-top:12px}
html[data-brand="wo"] .nav{justify-content:center;width:100%;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;margin-top:4px}
html[data-brand="wo"] .nav a{font-family:var(--ff-body);letter-spacing:.16em;text-transform:uppercase;font-size:calc(0.9rem * var(--text-scale));font-weight:500;padding:12px 14px}
html[data-brand="wo"] .brandmark{margin:0 auto}
html[data-brand="wo"] .head-cta{position:absolute;right:var(--pad);top:22px}
html[data-brand="wo"] .head.stuck .head-in{padding-top:6px}

/* varian header: Asosiasi (garis institusional + utility row) */
html[data-brand="asosiasi"] .head{border-bottom:3px solid var(--brand)}
html[data-brand="asosiasi"] .nav a{border-radius:4px;text-transform:uppercase;letter-spacing:.06em;font-size:calc(0.9rem * var(--text-scale));font-weight:700}
html[data-brand="asosiasi"] .brandmark .logo{border-radius:6px}
html[data-brand="asosiasi"] .nav a::after{height:3px;left:8px;right:8px;bottom:2px}

/* varian header: Mbak Ayu (monogram tipis, nav besar serif) */
html[data-brand="ayu"] .head{background:transparent;border-bottom:1px solid transparent}
html[data-brand="ayu"] .head.stuck{background:color-mix(in srgb,var(--surface) 88%, transparent);border-bottom-color:var(--line)}
html[data-brand="ayu"] .brandmark .logo{border-radius:50%;background:transparent;color:var(--brand-deep);border:1px solid var(--brand);box-shadow:none}
html[data-brand="ayu"] .nav a{font-family:"Cormorant Garamond",Georgia,serif;font-size:calc(1.02rem * var(--text-scale));letter-spacing:.03em;color:var(--ink);text-transform:none;font-weight:500}
html[data-brand="ayu"] .btn{border-radius:14px}

/* varian header: Pak Urip (blok tegas, uppercase, strip) */
html[data-brand="urip"] .head{background:var(--surface);border-bottom:1px solid var(--line)}
html[data-brand="urip"] .head .brandmark .logo{border-radius:6px;background:var(--brand)}
html[data-brand="urip"] .nav{gap:2px}
html[data-brand="urip"] .nav a{text-transform:uppercase;font-weight:800;font-size:calc(0.9rem * var(--text-scale));letter-spacing:.08em;border-radius:6px;padding:9px 11px}
html[data-brand="urip"] .nav a::after{bottom:3px;left:11px;right:11px;height:3px;background:var(--accent)}
html[data-brand="urip"] .btn{border-radius:6px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;font-size:calc(0.9rem * var(--text-scale))}

/* varian header: hub */
html[data-brand="hub"] .head{border-bottom:1px solid var(--line)}

.burger{display:none;width:48px;height:48px;border-radius:14px;border:1px solid var(--line-strong);background:var(--surface);align-items:center;justify-content:center;cursor:pointer}
.burger span{display:block;width:20px;height:2px;background:var(--ink);position:relative;transition:transform .3s,opacity .3s}
.burger span::before,.burger span::after{content:"";position:absolute;left:0;width:20px;height:2px;background:var(--ink);transition:transform .3s}
.burger span::before{top:-6px}.burger span::after{top:6px}
.burger[aria-expanded="true"] span{background:transparent}
.burger[aria-expanded="true"] span::before{transform:translateY(6px) rotate(45deg)}
.burger[aria-expanded="true"] span::after{transform:translateY(-6px) rotate(-45deg)}

.drawer{
  position:fixed;inset:0;z-index:90;background:var(--surface);
  transform:translateY(-100%);transition:transform .5s var(--ease);
  display:flex;flex-direction:column;padding:0;overflow-y:auto;
}
.drawer[open],.drawer.is-open{transform:translateY(0)}
.drawer-head{display:flex;align-items:center;justify-content:space-between;min-height:74px;padding:0 var(--pad);border-bottom:1px solid var(--line)}
.drawer nav{padding:18px var(--pad) 34px;display:flex;flex-direction:column}
.drawer nav a{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:16px 0;border-bottom:1px solid var(--line);
  font-family:var(--ff-display);font-size:calc(1.42rem * var(--text-scale));font-weight:600;
  transition:padding .3s var(--ease),color .3s;
}
.drawer nav a:hover,.drawer nav a[aria-current="page"]{color:var(--brand);padding-left:10px}
.drawer nav a svg{width:20px;height:20px;color:var(--accent)}
.drawer-foot{margin-top:auto;padding:22px var(--pad) calc(22px + env(safe-area-inset-bottom));background:var(--surface-2);border-top:1px solid var(--line);display:grid;gap:12px}
.x-btn{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center}
.x-btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- 7. HERO ---------------------------------------------------- */
.hero{position:relative;overflow:hidden;padding-block:clamp(34px,5vw,80px) var(--sec);isolation:isolate}
.hero-inner{position:relative;z-index:2;display:grid;gap:clamp(26px,4vw,54px);align-items:center}
.hero-a .hero-inner{grid-template-columns:1.06fr .94fr}
.hero-b .hero-inner{grid-template-columns:1fr}
.hero-c .hero-inner{grid-template-columns:.92fr 1.08fr}
.hero h1{margin-bottom:18px}
.hero .lead{margin-bottom:26px}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.hero-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding-top:22px;border-top:1px solid var(--line)}
.hero-media{position:relative}
.hero-media .media{box-shadow:var(--shadow-2);border:1px solid var(--line)}
.hero-media .media:first-child{aspect-ratio:4/5}
.float-card{
  position:absolute;left:-6%;bottom:8%;background:color-mix(in srgb,var(--surface) 88%, transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:18px;padding:16px 18px;box-shadow:var(--shadow-2);
  display:flex;gap:12px;align-items:center;max-width:min(320px,74%);
  animation:bob 6.5s ease-in-out infinite;
}
.float-card.alt{left:auto;right:-4%;bottom:auto;top:9%;animation-delay:1.4s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
.float-card .avatar{width:46px;height:46px;border-radius:50%;overflow:hidden;flex:none;border:2px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.15)}
.float-card b{display:block;font-size:calc(0.98rem * var(--text-scale));line-height:1.25}
.float-card span{font-size:calc(0.9rem * var(--text-scale));color:var(--muted)}

/* hero varian hub: stack kartu brand */
.hero-stack{display:grid;gap:14px}
.hero-stack .shot{position:relative;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow-2)}
.hero-stack .shot img{aspect-ratio:16/9;object-fit:cover;width:100%;transition:transform 1s var(--ease)}
.hero-stack .shot:hover img{transform:scale(1.05)}

/* hero varian b: poster penuh */
.hero-b{padding-block:0}
.hero-b .hero-bg{position:absolute;inset:0;z-index:0}
.hero-b .hero-bg img{width:100%;height:100%;object-fit:cover}
.hero-b .hero-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,rgba(18,26,22,.86),rgba(18,26,22,.42) 48%,rgba(18,26,22,.12))}
.hero-b .hero-inner{min-height:min(82vh,760px);align-content:center;color:#fff}
.hero-b .lead{color:rgba(255,255,255,.88)}
.hero-b .hero-stats{border-top-color:rgba(255,255,255,.26)}
.hero-b .metric b{color:#fff}
.hero-b .metric span{color:rgba(255,255,255,.72)}
html[data-brand="urip"] .hero-b .hero-bg::after{background:linear-gradient(96deg,rgba(14,58,34,.9),rgba(14,58,34,.55) 52%,rgba(14,58,34,.1))}

/* hero varian d: WO editorial */
.hero-d{text-align:center}
.hero-d .hero-inner{grid-template-columns:1fr;justify-items:center}
.hero-d .lead{margin-inline:auto}
.hero-d .hero-actions{justify-content:center}
.hero-d .strip{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:clamp(20px,3vw,34px);width:100%}
.hero-d .strip .media{aspect-ratio:4/3;border-radius:var(--radius-s);box-shadow:var(--shadow-1)}

/* ---------- 8. MARQUEE / TICKER --------------------------------------- */
.marquee{overflow:hidden;border-block:1px solid var(--line);background:var(--surface);padding:14px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee-track{display:flex;gap:34px;width:max-content;animation:slide 32s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{display:inline-flex;align-items:center;gap:12px;font-family:var(--ff-display);font-size:calc(1.06rem * var(--text-scale));color:var(--ink-soft);white-space:nowrap}
.marquee-track span::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
@keyframes slide{to{transform:translateX(-50%)}}
.marquee-brand{background:var(--brand);border-color:transparent}
.marquee-brand .marquee-track span{color:#fff}
.marquee-brand .marquee-track span::before{background:rgba(255,255,255,.7)}

/* ---------- 9. FEATURES / SPLIT / CARDS -------------------------------- */
.feature{display:flex;flex-direction:column;gap:12px;height:100%}
.feature h3{font-size:calc(1.16rem * var(--text-scale))}
.feature p{color:var(--ink-soft);margin:0}
.feature .num-tag{font-family:var(--ff-display);font-size:1rem;color:var(--accent);font-weight:700}

.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,62px);align-items:center}
.split.flip .split-media{order:-1}
.split-media{position:relative}
.split-media .media{box-shadow:var(--shadow-1);border:1px solid var(--line)}
.split-media .media.a{aspect-ratio:4/3}
.split-media .media.b{aspect-ratio:1/1;width:56%;position:absolute;right:-6%;bottom:-14%;border:6px solid var(--bg)}
.stack-media{position:relative}
.stack-media .media.main{aspect-ratio:4/5}
.badge-abs{position:absolute;top:14px;left:14px;background:color-mix(in srgb,var(--surface) 90%,transparent);backdrop-filter:blur(8px);padding:8px 13px;border-radius:999px;font-size:calc(0.9rem * var(--text-scale));font-weight:700;border:1px solid var(--line);z-index:3}
html[data-brand="asosiasi"] .split-media .media.b{display:none}

/* ---------- 10. TIMELINE / PROCESS ------------------------------------ */
.timeline{position:relative;display:grid;gap:22px;padding-left:26px}
.timeline::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--brand),var(--accent))}
.tl-item{position:relative;padding:20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);transition:transform .3s var(--ease),box-shadow .3s}
.tl-item:hover{transform:translateX(6px);box-shadow:var(--shadow-1)}
.tl-item::before{content:"";position:absolute;left:-26px;top:26px;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--brand)}
.tl-item time{font-weight:800;color:var(--brand);font-size:calc(0.9rem * var(--text-scale));letter-spacing:.05em}
.tl-item h4{margin:4px 0 6px}
.tl-item p{margin:0;color:var(--ink-soft)}

/* ---------- 11. GALLERY / LIGHTBOX ------------------------------------- */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.filters button{padding:9px 16px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-weight:600;font-size:calc(0.9rem * var(--text-scale));transition:all .25s var(--ease);min-height:44px}
.filters button:hover{border-color:var(--brand);color:var(--brand);transform:translateY(-2px)}
.filters button[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.gallery figure{margin:0;position:relative;border-radius:var(--radius-s);overflow:hidden;cursor:zoom-in;background:var(--bg-tint);border:1px solid var(--line)}
.gallery figure img{width:100%;height:100%;object-fit:cover;aspect-ratio:1/1;transition:transform .8s var(--ease),filter .5s}
.gallery figure:hover img{transform:scale(1.08)}
.gallery figcaption{position:absolute;inset:auto 0 0 0;margin:0;padding:26px 16px 14px;color:#fff;font-size:calc(0.9rem * var(--text-scale));background:linear-gradient(transparent,rgba(15,20,18,.86));transform:translateY(101%);transition:transform .4s var(--ease)}
.gallery figure:hover figcaption,.gallery figure:focus-visible figcaption{transform:translateY(0)}
.gallery .tall{grid-row:span 2}
.gallery .tall img{aspect-ratio:1/2}
.gallery .wide{grid-column:span 2}
.gallery .wide img{aspect-ratio:2/1}
.lb{position:fixed;inset:0;z-index:120;background:rgba(12,16,14,.93);display:none;place-items:center;padding:clamp(12px,4vw,44px)}
.lb.is-open{display:grid;animation:fadeIn .3s}
.lb img{max-height:82vh;max-width:min(1100px,94vw);border-radius:14px;box-shadow:0 40px 80px rgba(0,0,0,.6);animation:zoomIn .38s var(--ease)}
.lb .cap{color:#E9E4DA;margin-top:16px;text-align:center;font-size:calc(0.95rem * var(--text-scale))}
.lb .nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:54px;height:54px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;display:grid;place-items:center}
.lb .nav-btn:hover{background:#fff;color:#111}
.lb .prev{left:clamp(8px,2vw,26px)}.lb .next{right:clamp(8px,2vw,26px)}
.lb .close{position:absolute;top:16px;right:16px;width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:1.5rem}
@keyframes fadeIn{from{opacity:0}}
@keyframes zoomIn{from{opacity:0;transform:scale(.94)}}

/* ---------- 12. PRICING / ESTIMATOR ------------------------------------ */
.price{display:flex;flex-direction:column;gap:14px;height:100%}
.price .amount{font-family:var(--ff-display);font-size:clamp(1.7rem,1.1rem + 1.9vw,2.4rem);color:var(--brand);line-height:1}
.price .amount small{font-family:var(--ff-body);font-size:calc(0.9rem * var(--text-scale));color:var(--muted);font-weight:500;display:block;margin-top:6px}
.price.popular{border:2px solid var(--brand);box-shadow:var(--shadow-brand)}
.price .flag{position:absolute;top:0;right:0;background:var(--brand);color:#fff;font-size:calc(0.9rem * var(--text-scale));font-weight:700;padding:7px 14px;border-bottom-left-radius:14px;letter-spacing:.05em;text-transform:uppercase}
.est{display:grid;grid-template-columns:1.05fr .95fr;gap:clamp(20px,3vw,38px);align-items:start}
.est-total{font-family:var(--ff-display);font-size:clamp(2rem,1.3rem + 2.2vw,3rem);color:var(--brand);line-height:1}
.range{width:100%;accent-color:var(--brand);height:34px}

/* ---------- 13. TESTIMONI / SLIDER ------------------------------------- */
.slider{position:relative;overflow:hidden}
.slider-track{display:flex;gap:20px;transition:transform .6s var(--ease);scroll-snap-type:x mandatory}
.slide{flex:0 0 calc((100% - 40px)/3);scroll-snap-align:start}
.quote{display:flex;flex-direction:column;gap:14px;height:100%}
.quote .stars{color:var(--accent);letter-spacing:3px;font-size:1rem}
.quote blockquote{margin:0;font-family:var(--ff-display);font-size:calc(1.12rem * var(--text-scale));line-height:1.5;color:var(--ink)}
.quote .who{display:flex;gap:12px;align-items:center;margin-top:auto}
.quote .who img{width:48px;height:48px;border-radius:50%;object-fit:cover;flex:none}
.quote .who b{display:block;font-size:calc(0.98rem * var(--text-scale))}
.quote .who span{font-size:calc(0.9rem * var(--text-scale));color:var(--muted)}
.slider-nav{display:flex;gap:10px;align-items:center}
.slider-nav button{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:.25s}
.slider-nav button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.dots{display:flex;gap:7px;justify-content:center;margin-top:22px}
.dots button{width:9px;height:9px;border-radius:50%;border:0;background:var(--line-strong);cursor:pointer;padding:0;transition:.3s}
.dots button[aria-current="true"]{background:var(--brand);width:26px;border-radius:6px}

/* ---------- 14. FAQ ---------------------------------------------------- */
.faq{display:grid;gap:12px;max-width:900px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden;transition:box-shadow .3s,border-color .3s}
.faq details[open]{border-color:color-mix(in srgb,var(--brand) 40%,transparent);box-shadow:var(--shadow-1)}
.faq summary{list-style:none;cursor:pointer;padding:20px 22px;display:flex;gap:16px;align-items:center;font-weight:650;font-size:calc(1.02rem * var(--text-scale))}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-left:auto;font-family:var(--ff-display);font-size:1.6rem;color:var(--brand);line-height:1;transition:transform .35s var(--ease)}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq .ans{padding:0 22px 22px;color:var(--ink-soft);animation:slideDown .35s var(--ease)}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}}

/* ---------- 15. TABS --------------------------------------------------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:22px}
.tabs button{padding:13px 18px;background:none;border:0;border-bottom:3px solid transparent;cursor:pointer;font-weight:650;color:var(--muted);font-size:calc(0.95rem * var(--text-scale));min-height:44px;transition:.25s}
.tabs button:hover{color:var(--brand)}
.tabs button[aria-selected="true"]{color:var(--brand);border-color:var(--brand)}
.tab-panel{animation:fadeIn .35s var(--ease)}

/* ---------- 16. FORM ---------------------------------------------------- */
form.fw{display:grid;gap:16px}
.field{display:grid;gap:7px}
.field label,.legend{font-weight:650;font-size:calc(0.94rem * var(--text-scale));color:var(--ink)}
.field .req{color:var(--danger)}
.field input,.field select,.field textarea{
  width:100%;padding:14px 16px;border-radius:var(--radius-xs);
  border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);
  font-size:calc(1rem * var(--text-scale));min-height:54px;transition:border-color .25s,box-shadow .25s,background .25s;
}
.field textarea{min-height:124px;resize:vertical;line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px color-mix(in srgb,var(--brand) 16%,transparent)}
.field .hint{font-size:calc(0.9rem * var(--text-scale));color:var(--muted)}
.field .err{font-size:calc(0.9rem * var(--text-scale));color:var(--danger);font-weight:600;display:none}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--danger);background:#FFF7F5}
.field.invalid .err{display:block}
.field.valid input,.field.valid select{border-color:#95C9A9}
.field-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.choice{display:flex;gap:10px;flex-wrap:wrap}
.choice label{display:inline-flex;align-items:center;gap:8px;padding:11px 16px;border:1px solid var(--line-strong);border-radius:999px;cursor:pointer;font-size:calc(0.92rem * var(--text-scale));background:var(--surface);transition:.25s;min-height:46px}
.choice input{position:absolute;opacity:0;width:1px;height:1px}
.choice label:hover{border-color:var(--brand)}
.choice input:checked+span{font-weight:700}
.choice label:has(input:checked){background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:var(--shadow-brand)}
.form-side{display:grid;gap:14px;align-content:start}
.form-note{background:var(--brand-soft);border:1px solid color-mix(in srgb,var(--brand) 20%,transparent);border-radius:var(--radius-s);padding:20px;display:grid;gap:10px}
.success-box{background:#EDF8F1;border:1px solid #B9E0C6;color:#14603C;border-radius:var(--radius-s);padding:22px;display:grid;gap:12px;animation:pop .45s var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}

/* ---------- 17. KALENDER ------------------------------------------------ */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:clamp(16px,2vw,24px);box-shadow:var(--shadow-1)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:calc(0.9rem * var(--text-scale));font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:8px 0}
.cal-day{aspect-ratio:1/1;min-height:42px;border-radius:10px;border:1px solid transparent;background:var(--surface-2);cursor:pointer;font-weight:600;font-size:calc(0.94rem * var(--text-scale));display:grid;place-items:center;position:relative;transition:.22s;color:var(--ink)}
.cal-day:hover{background:var(--brand-soft);border-color:var(--brand);transform:scale(1.06)}
.cal-day[disabled]{background:transparent;color:var(--line-strong);cursor:not-allowed;transform:none}
.cal-day.full::after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:var(--danger)}
.cal-day.ok::after{content:"";position:absolute;bottom:6px;width:6px;height:6px;border-radius:50%;background:#2E9C64}
.cal-day[aria-pressed="true"]{background:var(--brand);color:#fff;border-color:var(--brand)}
.cal-legend{display:flex;gap:16px;margin-top:14px;font-size:calc(0.9rem * var(--text-scale));color:var(--muted);flex-wrap:wrap}
.cal-legend i{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}

/* ---------- 18. TABEL / STUDIO DATA ------------------------------------ */
.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--surface)}
table.data{width:100%;border-collapse:collapse;font-size:calc(0.94rem * var(--text-scale));min-width:680px}
table.data th,table.data td{padding:13px 15px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
table.data thead th{background:var(--surface-2);font-size:calc(0.9rem * var(--text-scale));text-transform:uppercase;letter-spacing:.07em;color:var(--muted);position:sticky;top:0;z-index:2}
table.data tbody tr{transition:background .2s}
table.data tbody tr:hover{background:var(--brand-soft)}
table.data td.actions{white-space:nowrap;display:flex;gap:6px}
.icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon-btn:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
.icon-btn.danger:hover{background:var(--danger);border-color:var(--danger)}
.status-pill{display:inline-flex;align-items:center;padding:4px 11px;border-radius:999px;font-size:calc(0.9rem * var(--text-scale));font-weight:700;background:var(--bg-tint);color:var(--ink-soft);border:1px solid var(--line)}
.status-pill.s-baru,.status-pill.s-dibuka,.status-pill.s-tersedia{background:#E7F5EC;color:#146B43;border-color:#BEE4CB}
.status-pill.s-diproses,.status-pill.s-konsultasi,.status-pill.s-menunggu{background:#FCF1DE;color:#8A5A0F;border-color:#F0D6AC}
.status-pill.s-arsip,.status-pill.s-batal{background:#F5E9E6;color:#96382A;border-color:#E9CCC5}
.empty{padding:46px 20px;text-align:center;color:var(--muted)}

/* ---------- 19. DOCK PEMILIH SITUS + BOTTOM BAR ------------------------ */
.dock{
  position:fixed;z-index:70;left:50%;transform:translateX(-50%);bottom:18px;
  display:flex;gap:6px;align-items:center;padding:8px;
  background:color-mix(in srgb,var(--ink) 92%, transparent);color:#F7F4EE;
  border:1px solid rgba(255,255,255,.16);border-radius:999px;
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  box-shadow:0 24px 50px -22px rgba(0,0,0,.65);max-width:calc(100vw - 24px);
}
.dock button,.dock a{
  border:0;background:transparent;color:#E7E1D6;cursor:pointer;
  padding:9px 14px;border-radius:999px;font-size:calc(0.9rem * var(--text-scale));font-weight:600;
  display:inline-flex;align-items:center;gap:8px;white-space:nowrap;transition:.28s var(--ease);min-height:42px;
}
.dock button:hover,.dock a:hover{background:rgba(255,255,255,.14);color:#fff;transform:translateY(-2px)}
.dock [aria-current="true"]{background:#F7F4EE;color:#17110C}
.dock .dock-label{font-size:calc(0.9rem * var(--text-scale));letter-spacing:.16em;text-transform:uppercase;opacity:.6;padding-left:6px}
.dock .sep{width:1px;height:22px;background:rgba(255,255,255,.2)}
.dock i.mark{width:9px;height:9px;border-radius:3px;display:inline-block}

.mobilebar{display:none}
.fab{position:fixed;right:14px;bottom:78px;z-index:69;display:grid;gap:10px}
.fab a{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-2);color:var(--brand-deep);transition:.3s var(--ease)}
.fab a:hover{transform:scale(1.08) translateY(-3px);background:var(--brand);color:#fff}
.fab a.wa{background:#128C4B;color:#fff;border-color:#128C4B}
.fab a svg{width:26px;height:26px}

/* ---------- 20. FOOTER -------------------------------------------------- */
.foot{background:var(--ink);color:#DCD7CC;position:relative;overflow:hidden;margin-top:var(--sec)}
.foot a{color:#DCD7CC;transition:color .25s,transform .25s}
.foot a:hover{color:#fff}
.foot-top{display:grid;grid-template-columns:1.35fr .8fr .8fr 1.05fr;gap:clamp(24px,3vw,48px);padding-block:clamp(44px,5vw,74px)}
.foot h4{color:#fff;font-family:var(--ff-body);font-size:calc(0.9rem * var(--text-scale));text-transform:uppercase;letter-spacing:.15em;margin-bottom:16px}
.foot .fnav{display:grid;gap:11px;font-size:calc(0.96rem * var(--text-scale))}
.foot .fnav a:hover{transform:translateX(4px)}
.foot .fbrand b{font-family:var(--ff-display);font-size:calc(1.5rem * var(--text-scale));color:#fff;display:block;margin-bottom:10px}
.foot .news{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.foot .news input{flex:1;min-width:190px;padding:13px 15px;border-radius:12px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#fff;min-height:52px;font-size:1rem}
.foot .news input::placeholder{color:rgba(255,255,255,.55)}
.foot .news input:focus{outline:none;border-color:var(--accent);background:rgba(255,255,255,.12)}
.foot-bottom{border-top:1px solid rgba(255,255,255,.14);padding-block:22px;display:flex;gap:16px;justify-content:space-between;align-items:center;flex-wrap:wrap;font-size:calc(0.9rem * var(--text-scale))}
.foot-pattern{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:var(--batik-src,none);background-size:110px}
.social{display:flex;gap:10px}
.social a{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.2);transition:.28s var(--ease)}
.social a:hover{background:#fff;color:var(--ink);transform:translateY(-3px)}
.social svg{width:20px;height:20px}
/* footer varian brand */
html[data-brand="wo"] .foot{background:#23131B}
html[data-brand="wo"] .foot .fbrand b{font-family:"Cormorant Garamond",serif;letter-spacing:.02em;font-weight:500;font-size:calc(1.9rem * var(--text-scale))}
html[data-brand="wo"] .foot-top{grid-template-columns:1.5fr .75fr .75fr 1fr}
html[data-brand="asosiasi"] .foot{background:#0B2038;border-top:6px solid var(--accent)}
html[data-brand="asosiasi"] .foot h4{color:#9FC1E6}
html[data-brand="asosiasi"] .foot-bottom{justify-content:flex-start}
html[data-brand="ayu"] .foot{background:#221A26}
html[data-brand="ayu"] .foot .fbrand b{font-family:"Marcellus",serif;font-size:calc(2rem * var(--text-scale));font-weight:400}
html[data-brand="ayu"] .foot .quotebox{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:calc(1.3rem * var(--text-scale));color:#EDE2EA;border-left:2px solid var(--accent);padding-left:18px;margin-top:18px}
html[data-brand="urip"] .foot{background:#122C1C}
html[data-brand="urip"] .foot h4{font-family:var(--ff-body);font-weight:900;letter-spacing:.14em}
html[data-brand="urip"] .foot .fbrand b{font-family:"Archivo",sans-serif;font-weight:900;text-transform:uppercase;letter-spacing:-.01em}

/* ---------- 21. HALAMAN HUB / PANDUAN / MODAL / TOAST ------------------ */
.brandgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(276px,1fr));gap:22px}
.bcard{position:relative;overflow:hidden;border-radius:var(--radius-lg);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow-1);transition:transform .5s var(--ease),box-shadow .5s}
.bcard:hover{transform:translateY(-9px) rotate(-.25deg);box-shadow:0 42px 70px -34px rgba(20,20,20,.42)}
.bcard .shot{aspect-ratio:16/10;overflow:hidden;position:relative}
.bcard .shot img{width:100%;height:100%;object-fit:cover;transition:transform 1.1s var(--ease)}
.bcard:hover .shot img{transform:scale(1.07)}
.bcard .shot::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(12,16,14,.72))}
.bcard .shot .tag{position:absolute;left:14px;top:14px;z-index:2;background:rgba(255,255,255,.92);padding:6px 12px;border-radius:999px;font-size:calc(0.9rem * var(--text-scale));font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.bcard .bc-body{padding:22px 24px 24px;display:grid;gap:12px}
.bcard .bc-body p{margin:0;color:var(--ink-soft);font-size:calc(0.97rem * var(--text-scale))}
.bcard ul{display:grid;gap:6px;font-size:calc(0.92rem * var(--text-scale));color:var(--muted)}
.bcard ul li{display:flex;gap:8px}
.bcard ul li::before{content:"›";color:var(--accent);font-weight:800}
.bcard .go{display:inline-flex;align-items:center;gap:8px;font-weight:700;color:var(--brand)}
.bcard .go svg{width:18px;height:18px;transition:transform .3s var(--ease)}
.bcard:hover .go svg{transform:translateX(5px)}

.modal-root{position:fixed;inset:0;z-index:110;display:none;padding:clamp(12px,3vw,34px);overflow-y:auto}
.modal-root.is-open{display:grid;place-items:center;animation:fadeIn .25s}
.modal-back{position:fixed;inset:0;background:rgba(14,18,16,.62);backdrop-filter:blur(3px)}
.modal{position:relative;width:min(720px,100%);background:var(--surface);border-radius:var(--radius);box-shadow:0 40px 80px -30px rgba(0,0,0,.55);animation:zoomIn .34s var(--ease);max-height:min(90vh,940px);display:flex;flex-direction:column}
.modal header{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:18px}
.modal .m-body{padding:22px 24px;overflow-y:auto}
.modal footer{padding:18px 24px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;background:var(--surface-2);border-radius:0 0 var(--radius) var(--radius)}
.modal.wide{width:min(1040px,100%)}

#toasts{position:fixed;z-index:130;right:14px;top:14px;display:grid;gap:10px;width:min(392px,calc(100vw - 28px))}
.toast{background:var(--ink);color:#F6F2EA;border-radius:16px;padding:15px 17px;box-shadow:0 22px 40px -18px rgba(0,0,0,.6);display:flex;gap:12px;align-items:flex-start;animation:toastIn .45s var(--ease);border:1px solid rgba(255,255,255,.12)}
.toast.ok{background:#12503A}.toast.err{background:#7A2417}
.toast b{display:block;font-size:calc(0.98rem * var(--text-scale));margin-bottom:2px}
.toast p{margin:0;font-size:calc(0.9rem * var(--text-scale));opacity:.88}
.toast svg{width:22px;height:22px;flex:none;margin-top:1px}
.toast.out{animation:toastOut .35s var(--ease) forwards}
@keyframes toastIn{from{opacity:0;transform:translateX(24px) scale(.96)}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px) scale(.95)}}

#progress{position:fixed;top:0;left:0;height:3px;width:0;z-index:140;background:linear-gradient(90deg,var(--brand),var(--accent));transition:width .12s linear}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{position:relative;flex:1;min-width:210px}
.search input{padding-left:44px}
.search svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{min-height:50px}
select.mini{min-height:46px;padding:9px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:calc(0.92rem * var(--text-scale))}

.synckit{display:grid;gap:12px}
.api-state{display:flex;align-items:center;gap:10px;font-weight:600;font-size:calc(0.9rem * var(--text-scale))}
.api-state i{width:10px;height:10px;border-radius:50%;background:#9AA39F}
.api-state.on i{background:#2E9C64;box-shadow:0 0 0 4px rgba(46,156,100,.18)}
.api-state.off i{background:#D9A526}
.api-state.err i{background:var(--danger)}

.code{background:#141B19;color:#D8E4DE;border-radius:var(--radius-s);padding:18px 20px;overflow-x:auto;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:calc(0.9rem * var(--text-scale));line-height:1.62;border:1px solid rgba(255,255,255,.08)}
.code .k{color:#F0C674}.code .s{color:#9BD39A}.code .c{color:#7A8C86;font-style:italic}
kbd{background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font-size:.85em;font-family:ui-monospace,monospace}

/* ---------- 22. REVEAL / MOTION --------------------------------------- */
.reveal{opacity:0;transform:translateY(26px);transition:opacity .78s var(--ease),transform .78s var(--ease);transition-delay:var(--d,0ms)}
.reveal.in{opacity:1;transform:none}
.reveal-x{opacity:0;transform:translateX(-26px)}
.reveal-x.in{opacity:1;transform:none}
.reveal-s{opacity:0;transform:scale(.955)}
.reveal-s.in{opacity:1;transform:none}
.stagger>*{opacity:0;transform:translateY(22px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.stagger.in>*{opacity:1;transform:none}
.stagger.in>*:nth-child(1){transition-delay:40ms}.stagger.in>*:nth-child(2){transition-delay:110ms}
.stagger.in>*:nth-child(3){transition-delay:180ms}.stagger.in>*:nth-child(4){transition-delay:250ms}
.stagger.in>*:nth-child(5){transition-delay:320ms}.stagger.in>*:nth-child(6){transition-delay:390ms}
.stagger.in>*:nth-child(7){transition-delay:460ms}.stagger.in>*:nth-child(8){transition-delay:530ms}
.stagger.in>*:nth-child(n+9){transition-delay:600ms}
.page-enter{animation:pageIn .5s var(--ease)}
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}}
.spin-slow{animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.shimmer{position:relative;overflow:hidden}
.shimmer::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-100%);animation:shimmer 3.4s ease-in-out infinite}
@keyframes shimmer{60%,100%{transform:translateX(100%)}}
.tilt{will-change:transform}
html.reduced *{animation:none!important;transition-duration:.01ms!important}
html.reduced .reveal,html.reduced .reveal-x,html.reduced .reveal-s,html.reduced .stagger>*{opacity:1!important;transform:none!important}

/* ---------- 23. RESPONSIVE -------------------------------------------- */
@media (max-width:1180px){
  .nav a{padding:9px 10px}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .slide{flex:0 0 calc((100% - 20px)/2)}
}
@media (max-width:1024px){
  :root{--head-h:70px}
  .hero-a .hero-inner,.hero-c .hero-inner{grid-template-columns:1fr}
  .hero-media{order:-1}
  .hero-media .media:first-child{aspect-ratio:16/10}
  .float-card{position:static;margin-top:12px;max-width:none;animation:none;backdrop-filter:none}
  .float-card.alt{display:none}
  .split{grid-template-columns:1fr}
  .split-media .media.b{position:static;width:100%;margin-top:12px;border:0}
  .est{grid-template-columns:1fr}
  .foot-top{grid-template-columns:1fr 1fr}
  .gallery{grid-template-columns:repeat(3,1fr)}
  .nav,.head-cta .btn-desk{display:none}
  .burger{display:inline-flex}
  html[data-brand="wo"] .head-cta{position:static}
  html[data-brand="wo"] .head-in{flex-direction:row;padding-top:0}
  html[data-brand="wo"] .brandmark{margin-right:auto}
  html[data-brand="wo"] .nav{display:none}
}
@media (max-width:820px){
  body{font-size:calc(16.5px * var(--text-scale))}
  .g3{grid-template-columns:1fr}
  .g2{grid-template-columns:1fr}
  .hero-stats{grid-template-columns:1fr;gap:12px;border:0;padding-top:6px}
  .hero-stats .metric{flex-direction:row;align-items:baseline;gap:10px}
  .gallery{grid-template-columns:repeat(2,1fr)}
  .gallery .wide,.gallery .tall{grid-column:auto;grid-row:auto}
  .gallery .tall img,.gallery .wide img{aspect-ratio:1/1}
  .slide{flex:0 0 100%}
  .field-2{grid-template-columns:1fr}
  .hero-d .strip{grid-template-columns:repeat(2,1fr)}
  .hero-d .strip .media:nth-child(3){display:none}
  .dock{left:10px;right:10px;transform:none;bottom:10px;overflow-x:auto;justify-content:flex-start;border-radius:20px;scrollbar-width:none;padding:7px}
  .dock::-webkit-scrollbar{display:none}
  .dock .dock-label{display:none}
  .fab{bottom:82px;right:10px}
  .foot-top{grid-template-columns:1fr;gap:28px}
  .topbar{display:none}
  .card{padding:22px}
  table.data{min-width:560px}
}
@media (max-width:560px){
  .wrap{padding-inline:16px}
  section.sec{padding-block:clamp(44px,10vw,66px)}
  .hero-actions .btn{flex:1 1 100%}
  .modal footer{flex-direction:column-reverse}
  .modal footer .btn{width:100%}
  .cal-grid{gap:4px}
  .cal-day{min-height:38px;font-size:calc(0.9rem * var(--text-scale))}
  .tabs button{padding:11px 12px;font-size:calc(0.9rem * var(--text-scale))}
  .price{padding:20px}
  .lb .nav-btn{width:44px;height:44px}
  .hero h1{font-size:clamp(2rem,8.6vw,2.6rem)}
}
@media (min-width:1440px){
  :root{--maxw:1290px}
}

/* ---------- 24. UTILITAS & PRINT -------------------------------------- */
.only-mobile{display:none!important}
@media (max-width:1024px){.only-mobile{display:revert!important}.hide-mobile{display:none!important}}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.textlink{color:var(--brand);font-weight:650;border-bottom:1px solid color-mix(in srgb,var(--brand) 35%,transparent);transition:.25s}
.textlink:hover{color:var(--brand-deep);border-color:var(--brand-deep)}
.tag-list{display:flex;gap:8px;flex-wrap:wrap}
.avatar-row{display:flex}
.avatar-row img{width:44px;height:44px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);margin-left:-12px;transition:transform .3s var(--ease)}
.avatar-row img:first-child{margin-left:0}
.avatar-row img:hover{transform:translateY(-5px) scale(1.06);z-index:2}
.ratio-note{font-size:calc(0.9rem * var(--text-scale));color:var(--muted)}
.badge-live{display:inline-flex;align-items:center;gap:7px;font-size:calc(0.9rem * var(--text-scale));font-weight:700;color:#0E5A34;background:#DDF3E5;padding:5px 11px;border-radius:999px}
.badge-live i{width:7px;height:7px;border-radius:50%;background:#17A15C;animation:pulse 1.8s infinite}
@media print{
  .head,.dock,.fab,.topbar,.foot,.mobilebar,#progress{display:none!important}
  body{background:#fff;color:#000;font-size:12pt}
  .card,.media{box-shadow:none!important;border:1px solid #ccc}
}

/* ---------- 24. KONTRAS BIDANG GELAP & UKURAN IKON ----------------------- */
.sec-brand{color:rgba(255,255,255,.94)}
.sec-brand p,.sec-brand .lead,.sec-brand .muted,.sec-brand li,.sec-brand td,.sec-brand th,.sec-brand label,.sec-brand span{color:inherit}
.sec-brand .eyebrow{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.26);color:#fff}
.sec-brand .ratio-note,.sec-brand .form-note{color:rgba(255,255,255,.75)}
.sec-brand .card,.sec-brand .price,.sec-brand .quote{background:rgba(255,255,255,.09);border-color:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(8px)}
.sec-brand .card-flat{background:rgba(255,255,255,.06)}
.sec-brand .card h2,.sec-brand .card h3,.sec-brand .card h4,.sec-brand .card b,.sec-brand .card strong{color:#fff}
.sec-brand .icon-badge{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.24)}
.sec-brand .chip,.sec-brand .chip-line,.sec-brand .chip-accent,.sec-brand .status-pill{background:rgba(255,255,255,.15);color:#fff;border-color:rgba(255,255,255,.24)}
.sec-brand .btn-ghost{border-color:rgba(255,255,255,.45);color:#fff;background:transparent}
.sec-brand .btn-ghost:hover{background:rgba(255,255,255,.16);color:#fff}
.sec-brand .num,.sec-brand .metric span{color:rgba(255,255,255,.6)}
.sec-brand .metric b{color:#fff}
.sec-brand .tl-item{border-left-color:rgba(255,255,255,.34)}
.sec-brand .faq details{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.18)}
.sec-brand .faq summary{color:#fff}
.sec-brand .table-wrap table.data{border-color:rgba(255,255,255,.22)}
.sec-brand .table-wrap table.data th{color:rgba(255,255,255,.7)}

const btn = (label, opts) => {
  opts = opts || {};
  const href = opts.href ? 'href="' + opts.href + '"' : 'href="#"';
  const data = opts.act ? ' data-act="' + opts.act + '"' + (opts.arg ? ' data-arg="' + esc(opts.arg) + '"' : '') : '';
  const ext = /^https?:|^mailto:|^tel:/.test(opts.href || '') ? ' target="_blank" rel="noopener"' : '';
  return '<a class="btn ' + (opts.style || '') + ' ' + (opts.cls || '') + '" ' + href + data + ext + '>' +
    (opts.icon ? (ICONS[opts.icon] || '') : '') + '<span>' + esc(label) + '</span></a>';
};

  artikel: [
    { id: 'ar-1', judul: 'Paes Ageng Bukan Sekadar Hitam di Dahi', kategori: 'Budaya', unit: 'Mbak Ayu', penulis: 'Ayu Puspita Sari', tanggal: '2026-09-12', tag: 'paes,keraton,filsafat', foto: 'ritual', status: 'Terbit', ringkas: 'Lengkung pada dahi pengantin adalah teks: mengatur wibawa, tahap laku, dan doa restu. Kami urai maknanya satu per satu.', body: 'Paes ageng hanya boleh dikenakan pengantin pertama yang menikah di dalam keraton. Bentuk gajahan, pengapit, dan gondha sari masing-masing memiliki tafsir. Gajahan sebagai lambang keagungan, pengapit sebagai pengingat bahwa hidup selalu berpasangan, dan gondha sari sebagai doa kemakmuran.\n\nDalam praktik merias, tiga hal yang menentukan keabsahan paes: ketebalan garis yang proporsional dengan tulang dahi, arah lengkung menuju pelipis, dan warna yang tidak boleh terlalu hitam pekat bagi kulit sawo matang terang. Kesalahan kecil pada lengkung akan mengubah keseluruhan wibawa wajah.\n\nPelestarian paling jujur bukan membekukan pakem, melainkan mengajarkan alasannya. Karena itu setiap kelas di LPK Putri Ayu Mandiri selalu dimulai dengan sesi membaca makna sebelum menyentuh kuas.' },
    { id: 'ar-2', judul: 'Tracer Study: 5 Tahun Lulusan Menyerap Pasar Kerja', kategori: 'Pelatihan', unit: 'LPK', penulis: 'Tim Mutu LPK', tanggal: '2026-08-30', tag: 'karier,data,alumni', foto: 'gradOutdoor', status: 'Terbit', ringkas: '87% lulusan bekerja atau membuka usaha dalam 6 bulan. Ini rincian per program yang perlu dibaca calon peserta.', body: 'Data dihimpun dari tracer study alumni 2021–2025 dengan tingkat respons 78%. Program tata rias mencatat 91% serapan, spa 88%, menjahit 85%, rambut 83%, kulit 82%.\n\nTemuan penting: alumni yang mengikuti pendampingan usaha pasca-lulus punya pendapatan bulanan 41% lebih tinggi dibanding yang tidak. Karena itu pendampingan kini menjadi bagian wajib, bukan opsional.\n\nRekomendasi kami untuk calon peserta: pilih program sesuai pasar terdekat dari rumah Anda, dan manfaatkan sesi magang 40 jam yang tersedia.' },
    { id: 'ar-3', judul: 'Skema APBD untuk Pelatihan Kerja: Panduan Desa', kategori: 'Kebijakan', unit: 'LPK', penulis: 'Bidang Kemitraan', tanggal: '2026-08-05', tag: 'apbd,proposal,desa', foto: 'meetingRoom', status: 'Terbit', ringkas: 'Langkah menyusun usulan pelatihan bersertifikat dari Musrenbang desa sampai masuk DPA Disnaker.', body: 'Usulan pelatihan akan kuat bila berangkat dari data pengangguran terbuka desa, daftar calon peserta bernama, dan rencana tindak lanjut berupa modal usaha atau link-and-match dengan industri.\n\nFormat proposal yang kami sarankan: (1) latar belakang dengan data BPS desa; (2) sasaran kuantitatif; (3) kurikulum dan sertifikat; (4) rincian biaya per peserta; (5) indikator keluaran; (6) komitmen pendampingan.\n\nTim kami mendampingi gratis untuk penyusunan dokumen bagi 20 desa mitra per tahun. Ajukan lewat formulir kemitraan.' },

      q.forEach(op => { (byColl[op.koleksi] = byColl[op.koleksi] || []).push(op); });
      for (const coll of Object.keys(byColl)) {
        for (const op of byColl[coll]) {
          try {
            if (op.action === 'create') await this.req(coll, { method: 'POST', body: op.data });
            else if (op.action === 'update') await this.req(coll + '/' + op.data.id, { method: 'PATCH', body: op.data });
            else if (op.action === 'delete') await this.req(coll + '/' + op.id, { method: 'DELETE', params: { hard: '1' } });
            const rec = DB.get(op.koleksi, op.data.id); if (rec) rec._synced = 1;
            q.shift(); this.saveQueue(q);
          } catch (e) { this.mark(false, 'Antrean ' + q.length + ' menunggu koneksi'); break; }
        }
      }
      DB.persist();
      this.state.lastSync = Date.now();
      this.mark(q.length === 0, q.length ? q.length + ' perubahan belum terkirim' : 'Semua perubahan tersinkron');
    } finally { this._busy = false; }
  },
  async health() {
    if (!this.enabled()) return { ok: false, local: true, message: 'API belum dipasang. Aplikasi tetap berjalan dengan LocalDB.' };
    try { const j = await this.req('', { params: {} }); this.mark(true, 'API siap'); return j; }
    catch (e) { this.mark(false, 'Gagal menghubungi API: ' + e.message); return { ok: false, error: String(e.message) }; }
  },
  async pullAll() {
    if (!this.enabled()) { Toast.show('API belum dipasang', 'Isi URL Apps Script pada panel Koneksi API untuk sinkronisasi.', 'err'); return; }
    Toast.show('Menarik data server…', 'Semua koleksi disinkronkan ke perangkat ini.');
    let n = 0;
    for (const c of Object.keys(SCHEMA)) {
      const j = await this.list(c, { limit: 200 });
      if (j && Array.isArray(j.data)) n += j.data.length;
    }
    this.state.lastSync = Date.now();
    render();
    Toast.show('Sinkron selesai', n + ' baris dari server digabung dengan data lokal.', 'ok');
  },
  mark(on, msg) { this.state.on = !!on; this.state.msg = msg || this.state.msg; this.paint(); },
  paint() {
    this.state.pending = this.queue().length;
    $$('.api-state').forEach(n => {
      const on = this.enabled() && this.state.on;
      n.className = 'api-state ' + (!this.enabled() ? 'off' : (on ? 'on' : 'err'));
      const label = n.querySelector('span'); if (label) label.textContent = this.enabled() ? (on ? 'REST API aktif' : 'LocalDB (API bermasalah)') : 'LocalDB aktif — offline-first';
    });
    const badge = $('#queueBadge'); if (badge) { badge.textContent = this.state.pending ? (this.state.pending + ' antrean') : 'tersinkron'; badge.className = 'status-pill ' + (this.state.pending ? 's-diproses' : 's-baru'); }
  }
};

   ============================================================================ */
const ROUTES = {
  hub: { beranda: 'beranda', panduan: 'panduan' },
  lpk: { '': 'beranda', beranda: 'beranda', tentang: 'tentang', program: 'program', kemitraan: 'kemitraan', galeri: 'galeri', kontak: 'kontak' },
  wo: { '': 'beranda', beranda: 'beranda', tentang: 'tentang', paket: 'paket', portfolio: 'portfolio', testimoni: 'testimoni', booking: 'booking' },
  asosiasi: { '': 'beranda', beranda: 'beranda', tentang: 'tentang', kegiatan: 'kegiatan', anggota: 'anggota', publikasi: 'publikasi', kontak: 'kontak' },
  ayu: { '': 'beranda', beranda: 'beranda', profil: 'profil', pakem: 'pakem', mahakarya: 'mahakarya', artikel: 'artikel', kolaborasi: 'kolaborasi' },
  urip: { '': 'beranda', beranda: 'beranda', profil: 'profil', visi: 'visi', gerakan: 'gerakan', opini: 'opini', kontak: 'kontak' }
};

const Router = {
  state: { brand: 'hub', page: 'beranda', slug: '', anchor: '' },
  parse(raw) {
    let h = (raw || location.hash || '#/hub').replace(/^#/, '');
    const qi = h.indexOf('?'); if (qi > -1) h = h.slice(0, qi);
    let anchor = '';
    const ai = h.indexOf('#');
    if (ai > -1) { anchor = h.slice(ai + 1); h = h.slice(0, ai); }
    const parts = h.split('/').filter(Boolean);
    let brand = parts[0] || 'hub';
    if (!BRANDS[brand]) { if (brand === 'studio' || brand === 'api' || brand === 'panduan') { this.state = { brand: 'hub', page: brand, slug: '', anchor: anchor }; return this.state; } brand = 'hub'; }
    let page = parts[1] || '';
    const slug = parts[2] || '';
    if (brand === 'hub' && !page) page = 'beranda';
    const mapped = (ROUTES[brand] || {})[page];
    this.state = { brand: brand, page: mapped || page || 'beranda', slug: slug, anchor: anchor };
    return this.state;
  },
  go(hash, replace) {
    const target = hash[0] === '#' ? hash : '#' + hash;
    if (location.hash === target) { window.dispatchEvent(new Event('hashchange')); return; }
    if (replace) history.replaceState(null, '', target); else location.hash = target;
  },
  start() {
    window.addEventListener('hashchange', () => App.route());
    App.route();
  }
};

function hrefFor(h) {
  if (!h) return 'href="#"';
  if (/^(https?:|mailto:|tel:)/.test(h)) return 'href="' + esc(h) + '" target="_blank" rel="noopener"';
  if (h.indexOf('#/') === 0) return 'href="' + esc(h) + '" data-spa="1"';
  if (/^#[a-z0-9-]+$/i.test(h)) return 'href="#/' + h.slice(1) + '" data-spa="1"';
  if (h[0] === '#') return 'href="#" data-anchor="' + esc(h.slice(1)) + '"';
  return 'href="' + esc(h) + '"';
}
function actionsHTML(list, cls) {
  if (!list) return '';
  return '<div class="hero-actions ' + (cls || '') + '">' + list.map(a =>
    '<a class="btn ' + (a.st || '') + '" ' + hrefFor(a.h) + '>' + (ICONS[a.ic] || '') + '<span>' + esc(a.l) + '</span></a>').join('') + '</div>';
}
function headHTML(s, extra) {
  if (!s || (!s.title && !s.eyebrow && !s.lead)) return extra || '';
  return '<div class="sec-head reveal' + (s.center ? ' center' : '') + '">' +
    (s.eyebrow ? '<span class="eyebrow"><i></i>' + esc(s.eyebrow) + '</span>' : '') +
    (s.title ? '<h2>' + s.title + '</h2>' : '') +
    (s.lead ? '<p class="lead">' + s.lead + '</p>' : '') + (extra || '') + '</div>';
}
function secOpen(s, cls) {
  const tone = s.dark ? ' sec-brand' : (s.tone === false ? '' : ' sec-tint');
  return '<section class="sec sec-' + s.t + tone + ' ' + (cls || '') + '"' + (s.id ? ' id="' + esc(s.id) + '"' : '') + ' data-sec="' + s.t + '">' +
    '<div class="batik" aria-hidden="true"></div><div class="wrap">';
}
const secClose = '</div></section>';

function fieldHTML(f, val, opts) {
  opts = opts || {};
  const id = (opts.prefix || 'fld') + '-' + f.k;
  const v = val === undefined || val === null ? '' : val;
  let input = '';
  const req = f.req ? ' required aria-required="true"' : '';
  if (f.t === 'textarea') input = '<textarea id="' + id + '" name="' + f.k + '" rows="4" placeholder="' + esc(f.ph || '') + '"' + req + '>' + esc(v) + '</textarea>';
  else if (f.t === 'select') input = '<select id="' + id + '" name="' + f.k + '"' + req + '><option value="">— pilih —</option>' +
    f.opts.map(o => '<option' + (String(o) === String(v) ? ' selected' : '') + '>' + esc(o) + '</option>').join('') + '</select>';
  else if (f.t === 'collection') {
    const rows = DB.all(f.coll).filter(r => String(r.status) !== 'Draf');
    input = '<select id="' + id + '" name="' + f.k + '"' + req + '><option value="">— pilih —</option>' +
      rows.map(r => '<option' + (String(r[f.labelKey]) === String(v) ? ' selected' : '') + '>' + esc(r[f.labelKey]) + '</option>').join('') + '</select>';
  } else if (f.t === 'photo') {
    const keys = Object.keys(PHOTOS);
    input = '<select id="' + id + '" name="' + f.k + '"><option value="">— tanpa foto —</option>' +
      keys.map(k => '<option value="' + k + '"' + (k === v ? ' selected' : '') + '>' + esc(PHOTOS[k][1].slice(0, 62)) + '</option>').join('') + '</select>' +
      '<div data-photo-prev style="margin-top:8px">' + (v ? '<div class="media" style="aspect-ratio:16/9;border-radius:10px;overflow:hidden">' + img(v, { w: 420 }) + '</div>' : '') + '</div>';
  }
  else if (f.t === 'rating') input = '<input id="' + id + '" type="number" name="' + f.k + '" min="1" max="5" step="1" value="' + esc(v) + '"' + req + '>';
  else input = '<input id="' + id + '" type="' + (f.t === 'number' ? 'number' : f.t === 'date' ? 'date' : f.t === 'email' ? 'email' : f.t === 'tel' ? 'tel' : 'text') +
    '" name="' + f.k + '" value="' + esc(v) + '" placeholder="' + esc(f.ph || '') + '" autocomplete="off"' + req + '>';
  return '<div class="field" data-field="' + f.k + '"><label for="' + id + '">' + esc(f.l) + (f.req ? ' <span class="req">*</span>' : '') + '</label>' + input +
    (f.hint ? '<span class="hint">' + esc(f.hint) + '</span>' : '') + '<span class="err" data-err></span></div>';
}

    const per = window.innerWidth > 1024 ? 3 : (window.innerWidth > 720 ? 2 : 1);
    const max = Math.max(0, slides.length - per);
    this.sliderIndex = (go !== null && go !== undefined) ? Math.min(Math.max(0, go * per), max) : clamp(this.sliderIndex + (dir === 'next' ? 1 : -1), 0, max);
    const step = slides[0].getBoundingClientRect().width + 20;

/* ---------- Validasi & submit formulir ------------------------------------ */
function validateForm(form, coll) {
  const fs = (SCHEMA[coll] || {}).fields || [];
  let ok = true; const data = {};
  fs.forEach(f => {
    const wrap = form.querySelector('[data-field="' + f.k + '"]'); if (!wrap) return;
    const inp = form.querySelector('[name="' + f.k + '"]'); if (!inp) return;
    const v = (inp.value || '').trim(); data[f.k] = v;
    let err = '';
    if (f.req && !v) err = f.l + ' wajib diisi';
    else if (v && f.t === 'email' && !/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(v)) err = 'Format email belum benar';
    else if (v && f.t === 'tel' && !/^[+0-9()\-\s]{8,20}$/.test(v)) err = 'Nomor telepon minimal 8 digit';
    else if (v && f.t === 'number' && isNaN(Number(v.replace(/[^\d.-]/g, '')))) err = 'Harus berupa angka';
    wrap.classList.toggle('invalid', !!err); wrap.classList.toggle('valid', !err && !!v);
    const e = wrap.querySelector('[data-err]'); if (e) e.textContent = err;
    if (err) ok = false;
  });
  const agree = form.querySelector('[name="setuju"]');
  if (agree && !agree.checked) { agree.closest('label').style.color = 'var(--danger)'; ok = false; }
  return { ok: ok, data: data };
}
function submitPublic(form) {

    if (t.closest('[data-act="drawer-close"]')) { UI.drawer(false); return; }
