    if (zoom) {
      const items = $$('[data-zoom]').map(n => ({ id: PHOTOS[n.dataset.zoom] ? PHOTOS[n.dataset.zoom][0] : 0, alt: (PHOTOS[n.dataset.zoom] || [0, 'Foto'])[1], cap: (n.querySelector('figcaption') || {}).textContent || (PHOTOS[n.dataset.zoom] || [0, ''])[1] })).filter(x => x.id);
      const i = items.findIndex(x => x.id === (PHOTOS[zoom.dataset.zoom] || [0])[0]);
      UI.lightbox(true, items, Math.max(i, 0)); return;
    }
    const lb = t.closest('[data-lb]');
    if (lb) {
      const k = lb.dataset.lb;
      if (k === 'close') UI.lightbox(false);
      else { UI.lb.i = (UI.lb.i + (k === 'next' ? 1 : -1) + UI.lb.items.length) % UI.lb.items.length; UI.lb.paint(); }
      return;
    }
    const slide = t.closest('[data-slide]'), goSlide = t.closest('[data-slide-go]');
    if (slide || goSlide) { App.slider(slide ? slide.dataset.slide : null, goSlide ? Number(goSlide.dataset.slideGo) : null); return; }
    const filt = t.closest('[data-filter-cat]');
    if (filt) {
      const sec = filt.closest('section'); const cat = filt.dataset.filterCat;
      $$('[data-filter-cat]', sec).forEach(b => b.setAttribute('aria-pressed', String(b === filt)));
      $$('[data-cat]', sec).forEach(fig => { fig.style.display = (cat === 'Semua' || fig.dataset.cat === cat) ? '' : 'none'; });
      return;
    }
    const tab = t.closest('[data-tab]');
    if (tab) {
      const wrap = tab.closest('section'); const i = tab.dataset.tab;
      $$('[data-tab]', wrap).forEach(b => b.setAttribute('aria-selected', String(b === tab)));
      $$('.tab-panel', wrap).forEach((p, j) => { p.hidden = j !== Number(i); });
      return;
    }
    const read = t.closest('[data-read]'); if (read) { articleModal(read.dataset.read); return; }
    const ev = t.closest('[data-act="event-join"]'); if (ev) { joinEventModal(ev.dataset.arg); return; }
    const mem = t.closest('[data-member]'); if (mem) { memberModal(mem.dataset.member); return; }
    const part = t.closest('[data-part]');
    if (part) {
      const sec = part.closest('section'); const media = sec.querySelector('.media');
      const idx = Number(part.dataset.part); const names = ['Gajahan', 'Pengapit', 'Gondha Sari', 'Pethet', 'Sanggul & Cunduk', 'Kalung & Selendang'];
      $$('[data-part]', sec).forEach(p => p.style.borderColor = '');
      part.style.borderColor = 'var(--brand)';
      let lab = media.querySelector('.badge-abs');
      if (!lab) { lab = document.createElement('span'); lab.className = 'badge-abs'; media.appendChild(lab); }
      lab.innerHTML = '0' + (idx + 1) + ' · ' + names[idx];
      lab.animate([{ transform: 'scale(.9)', opacity: 0 }, { transform: 'scale(1)', opacity: 1 }], { duration: 260, easing: 'ease-out' });
      return;
    }
    const again = t.closest('[data-form-again]');
    if (again) { const box = again.closest('[data-form-result]'); if (box) box.innerHTML = ''; const f = again.closest('form'); if (f) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); return; }
    /* — Studio & API — */
    const col = t.closest('[data-studio]');
    if (col) { Studio.coll = col.dataset.studio; Studio.page = 1; render(); return; }
    const pg = t.closest('[data-studio-page]');
    if (pg && !pg.disabled) { Studio.page = Math.max(1, Number(pg.dataset.studioPage)); render(); return; }
    const rf = t.closest('[data-studio-refresh]'); if (rf) { render(); UI.toast('Data disegarkan', SCHEMA[Studio.coll].label + ' dibaca ulang dari LocalDB.'); return; }
    const vw = t.closest('[data-studio-view]'); if (vw) { viewModal(Studio.coll, vw.dataset.studioView); return; }
    const ed = t.closest('[data-studio-edit]'); if (ed) { UI.closeModal(); editorModal(Studio.coll, ed.dataset.studioEdit); return; }
    const del = t.closest('[data-studio-del]'); if (del) { UI.closeModal(); studioDelete(del.dataset.studioDel); return; }
    const act = t.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'studio-new') { editorModal(Studio.coll, null); return; }
      if (a === 'studio-save') { studioSave(act); return; }
      if (a === 'studio-archive') { DB.update(Studio.coll, act.dataset.arg, { status: 'Arsip' }); UI.closeModal(); render(); UI.toast('Dipindahkan ke arsip', 'Riwayat tetap dapat ditelusuri di Studio.', 'ok'); return; }
      if (a === 'studio-hard') { DB.remove(Studio.coll, act.dataset.arg, true); UI.closeModal(); render(); UI.toast('Baris dihapus', 'Entri dihapus permanen dari perangkat ini.', 'ok'); return; }
      if (a === 'studio-export') { dl(new Blob([DB.csv(Studio.coll)], { type: 'text/csv' }), 'firmanweb-' + Studio.coll + '.csv'); UI.toast('CSV diekspor', SCHEMA[Studio.coll].label + ' · ' + DB.all(Studio.coll).length + ' baris.', 'ok'); return; }
      if (a === 'studio-export-all') { DB.exportAll(); UI.toast('JSON diekspor', 'Seluruh koleksi tersimpan dalam satu berkas.', 'ok'); return; }
      if (a === 'studio-reset') { UI.modal({ kicker: 'Bahaya', title: 'Muat ulang data contoh?', body: '<p>Seluruh perubahan pada perangkat ini akan diganti dengan konten awal jaringan. Data di server tidak tersentuh.</p>', footer: '<button class="btn btn-sm btn-ghost" data-close-modal><span>Batal</span></button><button class="btn btn-sm" style="--bg-b:var(--danger)" data-act="studio-reset-yes"><span>Ya, muat ulang</span></button>' }); return; }
      if (a === 'studio-reset-yes') { DB.reset(); UI.closeModal(); render(); UI.toast('Data contoh dimuat ulang', 'Semua koleksi dikembalikan ke kondisi awal.', 'ok'); return; }
      if (a === 'api-pull') { API.pullAll(); return; }
      if (a === 'api-flush') { API.flush().then(() => { render(); UI.toast('Antrean dikirim', API.queue().length ? API.queue().length + ' masih menunggu' : 'Semua tersinkron.', 'ok'); }); return; }
      if (a === 'api-clear') { API.set({ url: '', token: '' }); render(); UI.toast('Koneksi dilepas', 'Aplikasi kembali ke mode LocalDB.'); return; }
      if (a === 'settings') { UI.settings(); return; }
      if (a === 'textsize') { const cur = parseFloat(cssVar('--text-scale')) || 1; const next = cur === 1 ? 1.08 : cur === 1.08 ? 1.16 : 1; document.documentElement.style.setProperty('--text-scale', next); localStorage.setItem('fw-textscale', String(next)); UI.toast('Ukuran teks ' + next + '×', 'Preferensi tersimpan di perangkat ini.'); return; }
      if (a === 'est-wa') {
        const p = DB.get('paket', EST.state.pack) || {};
        const txt = ['Halo Paes Nusa, saya menyusun simulasi dari situs:'];
        txt.push('Paket: ' + (p.judul || '-'));
        txt.push('Tamu: ' + EST.state.guests + ' orang');
        if (EST.state.date) txt.push('Tanggal: ' + EST.state.date);
        txt.push('Tambahan: ' + (EST.state.addons.map(i => EST.addons[i].l).join(', ') || 'tidak ada'));
        txt.push('Estimasi: ' + money(EST._total || 0));
        window.open(waLink(txt.join('\n')), '_blank'); return;
      }
      if (a === 'motion') { document.documentElement.classList.toggle('reduced'); return; }
    }
    const sz = t.closest('[data-size]'); if (sz) { document.documentElement.style.setProperty('--text-scale', sz.dataset.size); localStorage.setItem('fw-textscale', sz.dataset.size); UI.closeModal(); UI.toast('Ukuran teks diperbarui', sz.querySelector('span').textContent); return; }
    const mo = t.closest('[data-motion]'); if (mo) { document.documentElement.classList.toggle('reduced', mo.dataset.motion === 'off'); localStorage.setItem('fw-motion', mo.dataset.motion); UI.closeModal(); UI.toast(mo.dataset.motion === 'off' ? 'Animasi dimatikan' : 'Animasi dinyalakan', 'Preferensi tersimpan.', 'ok'); return; }
    const day = t.closest('[data-cal-day]');
    if (day) {
      Cal.picked = day.dataset.calDay;
      $$('[data-cal-day]').forEach(d => d.setAttribute('aria-pressed', String(d === day)));
      const info = $('[data-cal-info]'); if (info) info.textContent = 'Tanggal dipilih: ' + tgl(Cal.picked) + ' — lanjutkan mengisi formulir booking di bawah.';
      const dt = $('#fld-booking-tanggal'); if (dt) { dt.value = Cal.picked; dt.closest('.field').classList.add('valid'); }
      const anchor = $('#formulir-booking'); if (anchor) App.scrollTo('formulir-booking');
      UI.toast('Tanggal dipilih', tgl(Cal.picked), 'ok'); return;
    }
    const cal = t.closest('[data-cal]');
    if (cal) { Cal.view = new Date(Cal.view.getFullYear(), Cal.view.getMonth() + (cal.dataset.cal === 'next' ? 1 : -1), 1); Cal.paint(); return; }
    const dir = t.closest('[data-dir]');
    if (dir) { Dir.page = Math.max(1, Dir.page + (dir.dataset.dir === 'next' ? 1 : -1)); paintDirectory(); return; }
    const chk = t.closest('[data-check]');
    if (chk) { setTimeout(() => { chk.closest('label').style.opacity = chk.checked ? '.6' : '1'; chk.closest('label').style.textDecoration = chk.checked ? 'line-through' : ''; }, 10); return; }
    if (t.closest('a[href^="#/"]') || t.closest('[data-spa]')) { /* dihandle di atas */ }
  });
  document.addEventListener('submit', function (e) {
    const f = e.target;
    if (f.matches('[data-form]')) { e.preventDefault(); submitPublic(f); return; }
    if (f.matches('[data-sub]')) {
      e.preventDefault();
      const email = (f.querySelector('input[name="email"]').value || '').trim();
      if (!/^[^\s@]+@[^\s@]+\.[a-z]{2,}$/i.test(email)) { UI.toast('Email belum valid', 'Contoh: nama@email.com', 'err'); return; }
      DB.create('subscriber', { email: email, minat: 'Semua', nama: '', status: 'Baru' });
      const note = f.parentElement.querySelector('[data-sub-note]');
      if (note) note.textContent = 'Terima kasih — ' + email + ' terdaftar. Konfirmasi dikirim dalam 24 jam.';
      f.reset(); UI.toast('Berlangganan aktif', 'Kabar bulanan dari jaringan: ' + email, 'ok');
      return;
    }
    if (f.matches('[data-act="api-save"]') || f.querySelector('[data-act="api-save"]')) {
      e.preventDefault();
      const url = (f.querySelector('[name="url"]').value || '').trim(), token = (f.querySelector('[name="token"]').value || '').trim();
      API.set({ url: url, token: token });
      API.health().then(j => {
        const out = $('#api-out');
        if (out) out.textContent = j && j.ok ? 'Berhasil terhubung. Layanan: ' + (j.service || '-') + ' v' + (j.version || '-') + ' · koleksi terdeteksi: ' + Object.keys(j.counts || {}).length + '.' : (j && j.local ? 'Mode lokal. Aplikasi tetap berfungsi penuh memakai LocalDB; isi URL Apps Script bila ingin sinkron antar perangkat.' : 'Koneksi gagal: ' + (j && (j.message || j.error) || 'tidak ada respons'));
        UI.toast(j && j.ok ? 'API tersambung' : 'Belum tersambung', out ? out.textContent.slice(0, 80) : '', j && j.ok ? 'ok' : '');
        render();
      });
      return;
    }
  });
  document.addEventListener('input', debounce(function (e) {
    const q = e.target.closest('[data-studio-q]');
    if (q) { Studio.q = q.value; Studio.page = 1; const box = $('#studio-table'); if (box) { box.innerHTML = Studio.table(); bindAfter(); } return; }
    const dq = e.target.closest('[data-dir="q"]');
    if (dq) { Dir.q = dq.value; Dir.page = 1; paintDirectory(); return; }
    const est = e.target.closest('[data-est]');
    if (est) { const k = est.dataset.est; if (k === 'guests') { EST.state.guests = Number(est.value); EST.calc(); } return; }
    const c = e.target.closest('[data-calc]');
    if (c) { CALC.bind(); return; }
    const ph = e.target.closest('select[name="foto"]');
    if (ph) { const prev = ph.closest('.field').querySelector('[data-photo-prev]'); if (prev) prev.innerHTML = ph.value ? '<div class="media" style="aspect-ratio:16/9;border-radius:10px;overflow:hidden">' + img(ph.value, { w: 420 }) + '</div>' : ''; return; }
  }, 220));
  document.addEventListener('change', function (e) {
    const s = e.target.closest('[data-studio-sort]');
    if (s) { Studio.sort = s.value; render(); return; }
    const d = e.target.closest('[data-dir="cat"]'); if (d) { Dir.cat = d.value; Dir.page = 1; paintDirectory(); return; }
    const c = e.target.closest('[data-dir="cabang"]'); if (c) { Dir.cabang = c.value; Dir.page = 1; paintDirectory(); return; }
    if (e.target.id === 'studio-import' && e.target.files[0]) { DB.importAll(e.target.files[0]); e.target.value = ''; return; }
    if (e.target.closest('[data-est]')) EST.mount();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if ($('#lightbox').classList.contains('is-open')) { UI.lightbox(false); return; }
      if ($('#modalRoot').classList.contains('is-open')) { UI.closeModal(); return; }
      if ($('#drawer').classList.contains('is-open')) { UI.drawer(false); $('#burger').focus(); return; }
    }
    if ($('#lightbox').classList.contains('is-open')) {
      if (e.key === 'ArrowRight') { UI.lb.i = (UI.lb.i + 1) % UI.lb.items.length; UI.lb.paint(); }
      if (e.key === 'ArrowLeft') { UI.lb.i = (UI.lb.i - 1 + UI.lb.items.length) % UI.lb.items.length; UI.lb.paint(); }
    }
    if (e.key === 'Enter' || e.key === ' ') {
      const z = document.activeElement && document.activeElement.closest && document.activeElement.closest('[data-zoom]');
      if (z) { e.preventDefault(); z.click(); }
    }
  });
  let lastY = 0;
  window.addEventListener('scroll', function () {
    const p = $('#progress'); const h = document.documentElement.scrollHeight - window.innerHeight;
    if (p) p.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + '%';
    const head = $('.head'); if (head) head.classList.toggle('stuck', window.scrollY > 8);
    const y = window.scrollY; const fab = $('#fab');
    if (fab) fab.style.opacity = (y > lastY && y > 500) ? '.35' : '1';
    lastY = y;
  }, { passive: true });
  window.addEventListener('online', () => { API.mark(true, 'Kembali daring'); API.flush(); });
}
function bindAfter() { Motion.observe($('#studio-table') || document); API.paint(); }
function render() { App.route(); }
/* ---------- Boot ------------------------------------------------------------ */
(function boot() {
  const scale = localStorage.getItem('fw-textscale'); if (scale) document.documentElement.style.setProperty('--text-scale', scale);
  const motion = localStorage.getItem('fw-motion');
  if (motion === 'off' || (motion === null && window.matchMedia('(prefers-reduced-motion: reduce)').matches)) document.documentElement.classList.add('reduced');
  document.querySelectorAll('.marquee-track').forEach(() => { });
  DB.boot();
  bindGlobal();
  Router.start();
  setTimeout(() => API.flush(), 1400);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => document.body.classList.add('fonts-in'));
})();
</script>
